buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Fix for old React Native packages missing compileSdk
subprojects {
    plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.contains('AppPlugin') || plugin.class.name.contains('LibraryPlugin')) {
            extensions.findByName('android')?.with {
                if (!it.hasProperty('compileSdkVersion') || it.compileSdkVersion == null) {
                    it.compileSdkVersion rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}
